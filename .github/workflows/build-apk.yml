name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect project type
        id: detect
        run: |
          if [ -f pubspec.yaml ]; then T=flutter
          elif ls capacitor.config.* >/dev/null 2>&1; then T=capacitor
          elif [ -f package.json ] && grep -Eq '"(expo|react-native)"' package.json; then T=reactnative
          elif [ -f gradlew ]; then T=android
          elif [ -f index.html ] || [ -f package.json ]; then T=web
          else T=unknown; fi
          echo "type=$T" >> "$GITHUB_OUTPUT"
          echo "Detected project type: $T"

      - name: Unknown project
        if: steps.detect.outputs.type == 'unknown'
        run: |
          echo "Could not detect project type. Files in repo root:"
          ls -la
          exit 1

      # ---------- Flutter ----------
      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.type == 'flutter'
        with:
          channel: stable
          cache: true

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        run: |
          [ -d android ] || flutter create --platforms=android .
          flutter pub get
          flutter build apk --release || flutter build apk --debug

      # ---------- Native Android ----------
      - name: Build native Android APK
        if: steps.detect.outputs.type == 'android'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ---------- Capacitor ----------
      - name: Build Capacitor APK
        if: steps.detect.outputs.type == 'capacitor'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build --if-present
          [ -d android ] || npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ---------- React Native / Expo ----------
      - name: Build React Native APK
        if: steps.detect.outputs.type == 'reactnative'
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile
          else npm install; fi
          [ -d android ] || npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ---------- Plain web (HTML / Vite / React) wrapped with Capacitor ----------
      - name: Wrap web app and build APK
        if: steps.detect.outputs.type == 'web'
        run: |
          SRC=.
          if [ -f package.json ] && grep -q '"build"' package.json; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build
            for d in dist build out; do
              if [ -f "$d/index.html" ]; then SRC=$d; break; fi
            done
          fi
          mkdir -p www
          if [ "$SRC" = "." ]; then
            rsync -a --exclude=.git --exclude=.github --exclude=www --exclude=node_modules ./ www/
          else
            cp -r "$SRC"/. www/
          fi
          [ -f package.json ] || npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Breathe Free" com.saad.breathefree --web-dir=www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ---------- Collect ----------
      - name: Collect APK
        run: |
          mkdir -p apk-out
          find . -name "*.apk" -path "*outputs*" -not -path "./apk-out/*" -exec cp {} apk-out/ \;
          ls -la apk-out

      - uses: actions/upload-artifact@v4
        with:
          name: breathe-free-apk
          path: apk-out/*.apk
          if-no-files-found: error
