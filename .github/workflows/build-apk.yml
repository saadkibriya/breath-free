name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pick Gradle version from AGP version
        id: gv
        run: |
          AGP=""
          if [ -f gradle/libs.versions.toml ]; then
            AGP=$(grep -E '^\s*(agp|androidGradlePlugin|android-gradle-plugin)\s*=' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "Detected AGP version: '$AGP'"
          case "$AGP" in
            8.*) G=8.14.3 ;;
            *)   G=current ;;
          esac
          echo "Using Gradle: $G"
          echo "gradle=$G" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.gradle }}

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p app
          [ -f app/debug.keystore ] || cp debug.keystore app/debug.keystore
          ls -la debug.keystore app/debug.keystore

      - name: Prepare missing config files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          KEY="${GEMINI_API_KEY_SECRET:-MY_GEMINI_API_KEY}"
          [ -f .env ] || echo "GEMINI_API_KEY=$KEY" > .env
          [ -f secrets.properties ] || echo "GEMINI_API_KEY=$KEY" > secrets.properties

          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Used google-services.json from repo secret"
            else
              PKG=""
              for f in app/build.gradle.kts app/build.gradle; do
                if [ -f "$f" ] && [ -z "$PKG" ]; then
                  PKG=$(grep -oE 'applicationId\s*=?\s*"[^"]+"' "$f" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
                  [ -n "$PKG" ] || PKG=$(grep -oE 'namespace\s*=?\s*"[^"]+"' "$f" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
                fi
              done
              [ -n "$PKG" ] || PKG="com.example.breathefree"
              echo "Creating placeholder google-services.json for package: $PKG"
              printf '{"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"%s"}},"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' "$PKG" > app/google-services.json
            fi
          fi

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --console=plain --no-daemon > build.log 2>&1
          CODE=$?
          echo "Gradle exit code: $CODE"
          if [ $CODE -ne 0 ]; then
            echo "===== ERRORS ====="
            grep -E '^e: ' build.log | head -40
            echo "----- What went wrong -----"
            sed -n '/What went wrong/,/\* Try:/p' build.log | head -50
            echo "----- Other errors -----"
            grep -iE 'AAPT|Manifest merger|Duplicate class|Could not resolve|Unresolved reference|Keystore|signing' build.log | head -30
          fi
          exit $CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find . -path "*build/outputs/apk*" -name "*.apk" -not -path "./apk-out/*" -exec cp {} apk-out/ \;
          ls -la apk-out

      - uses: actions/upload-artifact@v4
        with:
          name: breath-free-apk
          path: apk-out/*.apk
          if-no-files-found: error
